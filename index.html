<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Snow Rider</title> <style> * { box-sizing: border-box; } html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #081522; } body { display: flex; justify-content: center; align-items: center; } #game { position: relative; width: 100vw; height: 100vh; max-width: 1000px; overflow: hidden; background: linear-gradient(#74c9ff, #dff6ff 48%, #ffffff); } /* Sky */ .sky { position: absolute; inset: 0 0 55% 0; background: linear-gradient(#57b9f4, #d8f5ff); } .mountain { position: absolute; bottom: 42%; width: 0; height: 0; border-left: 180px solid transparent; border-right: 180px solid transparent; border-bottom: 250px solid #b9d8e8; opacity: .9; } .mountain.one { left: -80px; } .mountain.two { right: -100px; transform: scale(.8); } .mountain.three { left: 30%; transform: scale(.7); } /* Slope */ #slope { position: absolute; left: 50%; bottom: -20%; width: 75%; height: 90%; transform: translateX(-50%) perspective(500px) rotateX(8deg); background: repeating-linear-gradient( 90deg, rgba(180, 220, 240, .2) 0px, rgba(180, 220, 240, .2) 3px, transparent 3px, transparent 80px ), linear-gradient(90deg, #cceeff, #ffffff 50%, #cceeff); clip-path: polygon(25% 0, 75% 0, 100% 100%, 0 100%); box-shadow: 0 0 40px rgba(255,255,255,.8); } /* UI */ #hud { position: absolute; top: 18px; left: 18px; right: 18px; z-index: 20; display: flex; justify-content: space-between; gap: 10px; } .hudBox { background: rgba(0, 25, 45, .65); color: white; padding: 10px 16px; border-radius: 12px; backdrop-filter: blur(5px); box-shadow: 0 5px 15px rgba(0,0,0,.2); } .hudBox span { color: #7de3ff; font-weight: bold; } /* Player */ #player { position: absolute; z-index: 10; width: 70px; height: 70px; left: 50%; bottom: 20%; transform: translateX(-50%); transition: transform .08s linear; } .rider { position: absolute; width: 34px; height: 42px; left: 18px; top: 0; background: #e53935; border-radius: 18px 18px 10px 10px; box-shadow: 0 5px 8px rgba(0,0,0,.25); } .rider::before { content: ""; position: absolute; width: 25px; height: 25px; background: #ffd3a6; border-radius: 50%; left: 4px; top: -17px; } .rider::after { content: ""; position: absolute; width: 30px; height: 12px; background: #222; border-radius: 50%; left: 2px; top: -19px; } .sled { position: absolute; width: 75px; height: 12px; bottom: 4px; left: -3px; background: #e53935; border-radius: 50%; transform: rotate(-5deg); box-shadow: 0 5px 4px rgba(0,0,0,.2); } .sled::after { content: ""; position: absolute; width: 78px; height: 5px; background: #222; bottom: -5px; left: -2px; border-radius: 50%; } /* Objects */ .object { position: absolute; z-index: 8; top: -100px; font-size: 40px; user-select: none; } .tree { font-size: 55px; } .rock { font-size: 42px; } .present { font-size: 42px; filter: drop-shadow(0 5px 3px rgba(0,0,0,.25)); } /* Start / game over */ #menu { position: absolute; z-index: 50; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(3, 18, 30, .65); } .panel { width: min(90%, 450px); padding: 35px; text-align: center; color: white; background: rgba(4, 28, 47, .92); border: 2px solid rgba(125,227,255,.5); border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.4); } .panel h1 { margin-top: 0; font-size: 48px; color: #7de3ff; text-shadow: 0 3px 10px #167ca0; } .panel p { color: #cdefff; line-height: 1.6; } button { border: 0; border-radius: 12px; padding: 14px 25px; font-size: 18px; font-weight: bold; cursor: pointer; background: #20aee5; color: white; box-shadow: 0 5px 0 #08749e; } button:hover { background: #35c2f5; } button:active { transform: translateY(3px); box-shadow: 0 2px 0 #08749e; } /* Mobile controls */ #controls { position: absolute; z-index: 30; bottom: 20px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 25px; pointer-events: none; } .control { width: 75px; height: 65px; border-radius: 18px; background: rgba(0,30,50,.65); color: white; font-size: 28px; pointer-events: auto; user-select: none; touch-action: none; } /* Score popup */ .popup { position: absolute; z-index: 40; color: #fff; font-size: 22px; font-weight: bold; pointer-events: none; animation: popup .8s ease-out forwards; text-shadow: 0 2px 5px #000; } @keyframes popup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60px); } } @media (max-width: 600px) { .hudBox { padding: 8px 10px; font-size: 13px; } #player { transform: translateX(-50%) scale(.85); } .panel h1 { font-size: 38px; } } </style> </head> <body> <div id="game"> <div class="sky"></div> <div class="mountain one"></div> <div class="mountain two"></div> <div class="mountain three"></div> <div id="slope"></div> <div id="hud"> <div class="hudBox"> Score: <span id="score">0</span> </div>
<div class="hudBox">
  🎁 Gifts: <span id="gifts">0</span>
</div>

<div class="hudBox">
  Speed: <span id="speed">1</span>
</div>

</div> <div id="player"> <div class="rider"></div> <div class="sled"></div> </div> <div id="controls"> <button class="control" id="left">◀</button> <button class="control" id="right">▶</button> </div> <div id="menu"> <div class="panel"> <h1>❄️ Snow Rider</h1>
  <p>
    Ride down the mountain, dodge trees and rocks,
    and collect as many presents as possible!
  </p>

  <p>
    Use <b>← →</b> or <b>A / D</b> to steer.
  </p>

  <button id="startButton">Start Riding</button>
</div>

</div> </div> <script> const game = document.getElementById("game"); const player = document.getElementById("player"); const menu = document.getElementById("menu"); const scoreDisplay = document.getElementById("score"); const giftsDisplay = document.getElementById("gifts"); const speedDisplay = document.getElementById("speed"); const startButton = document.getElementById("startButton"); const leftButton = document.getElementById("left"); const rightButton = document.getElementById("right"); let running = false; let score = 0; let gifts = 0; let playerX = 50; let speed = 5; let difficulty = 1; let keys = { left: false, right: false }; let objects = []; let spawnTimer = 0; let lastTime = 0; /* Start game */ startButton.addEventListener("click", startGame); function startGame() { menu.style.display = "none"; score = 0; gifts = 0; speed = 5; difficulty = 1; playerX = 50; objects.forEach(object => object.element.remove()); objects = []; running = true; lastTime = performance.now(); requestAnimationFrame(gameLoop); updateHUD(); } /* Keyboard */ document.addEventListener("keydown", event => { if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") { keys.left = true; } if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") { keys.right = true; } }); document.addEventListener("keyup", event => { if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") { keys.left = false; } if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") { keys.right = false; } }); /* Mobile controls */ function holdButton(button, direction) { button.addEventListener("pointerdown", event => { event.preventDefault(); keys[direction] = true; }); button.addEventListener("pointerup", () => { keys[direction] = false; }); button.addEventListener("pointerleave", () => { keys[direction] = false; }); button.addEventListener("pointercancel", () => { keys[direction] = false; }); } holdButton(leftButton, "left"); holdButton(rightButton, "right"); /* Spawn objects */ function spawnObject() { const element = document.createElement("div"); const random = Math.random(); let type; if (random < .55) { type = "tree"; element.textContent = "🌲"; } else if (random < .8) { type = "rock"; element.textContent = "🪨"; } else { type = "present"; element.textContent = "🎁"; } element.className = "object " + type; /* Keep objects inside the visible slope. */ const x = 20 + Math.random() * 60; element.style.left = x + "%"; game.appendChild(element); objects.push({ element: element, x: x, y: -100, type: type }); } /* Collision */ function collision(object) { const playerRect = player.getBoundingClientRect(); const objectRect = object.element.getBoundingClientRect(); return !( playerRect.right < objectRect.left + 10 || playerRect.left > objectRect.right - 10 || playerRect.bottom < objectRect.top + 10 || playerRect.top > objectRect.bottom - 10 ); } /* Popup */ function createPopup(text, x, y) { const popup = document.createElement("div"); popup.className = "popup"; popup.textContent = text; popup.style.left = x + "px"; popup.style.top = y + "px"; game.appendChild(popup); setTimeout(() => { popup.remove(); }, 800); } /* End game */ function gameOver() { running = false; menu.style.display = "flex"; menu.querySelector(".panel").innerHTML = ` <h1>💥 Crash!</h1> <p> Your ride is over. </p> <p> Score: <b>${Math.floor(score)}</b><br> Presents: <b>${gifts}</b> </p> <button id="restartButton"> Ride Again </button> `; document .getElementById("restartButton") .addEventListener("click", startGame); } /* Update HUD */ function updateHUD() { scoreDisplay.textContent = Math.floor(score); giftsDisplay.textContent = gifts; speedDisplay.textContent = (speed / 5).toFixed(1) + "x"; } /* Main game loop */ function gameLoop(time) { if (!running) return; const delta = Math.min((time - lastTime) / 16.67, 3); lastTime = time; /* Steering */ if (keys.left) { playerX -= .75 * delta; } if (keys.right) { playerX += .75 * delta; } /* Keep player on the slope. */ playerX = Math.max(12, Math.min(88, playerX)); player.style.left = playerX + "%"; /* Increase speed over time. */ speed += .0008 * delta; difficulty += .00025 * delta; score += .06 * speed * delta; /* Spawn objects. */ spawnTimer -= delta; if (spawnTimer <= 0) { spawnObject(); spawnTimer = Math.max(18, 45 - difficulty * 3); } /* Move objects. */ for (let i = objects.length - 1; i >= 0; i--) { const object = objects[i]; object.y += speed * delta; object.element.style.top = object.y + "px"; /* Check collision. */ if (collision(object)) { if (object.type === "present") { gifts++; score += 100; const rect = object.element.getBoundingClientRect(); createPopup( "+100 🎁", rect.left, rect.top ); object.element.remove(); objects.splice(i, 1); } else { gameOver(); return; } } /* Remove objects after they leave the screen. */ if (object.y > game.clientHeight + 100) { object.element.remove(); objects.splice(i, 1); } } updateHUD(); requestAnimationFrame(gameLoop); } </script> </body> </html>
